[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflcarddb"
version = "0.1.0"
description = "Daily scraper and SQLite warehouse for eBay football card sold listings"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# eBay refuses the plain HTTP client on some connections (403 on the first
# request), so the browser engine is the fallback that actually gets through.
# Needs `playwright install chromium` afterwards to fetch the browser itself.
browser = ["playwright>=1.40"]
# curl_cffi reproduces a real Chrome's TLS ClientHello, which is what eBay
# fingerprints -- it refuses `requests` before HTTP is even spoken.
impersonate = ["curl_cffi>=0.7"]
# Reading the card off its photo. RapidOCR rather than Tesseract because it
# installs from pip with its models inside the wheel -- Tesseract needs a
# separate system binary, which on a Windows PC is the difference between a
# working feature and a support conversation. ~200MB with onnxruntime, which is
# why it is not in the default install.
vision = ["rapidocr-onnxruntime>=1.3", "pillow>=10.0"]
# Everything needed to actually get through.
all = ["playwright>=1.40", "curl_cffi>=0.7"]

[project.scripts]
nflcarddb = "nflcarddb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nflcarddb = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
