[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflcarddb"
version = "0.1.0"
description = "Daily scraper and SQLite warehouse for eBay football card sold listings"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# eBay refuses the plain HTTP client on some connections (403 on the first
# request), so the browser engine is the fallback that actually gets through.
# Needs `playwright install chromium` afterwards to fetch the browser itself.
browser = ["playwright>=1.40"]

[project.scripts]
nflcarddb = "nflcarddb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nflcarddb = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
