# NflCardDB scrape configuration.
#
# VERIFY THE CATEGORY IDS BEFORE YOUR FIRST REAL RUN.
# eBay reshuffles its taxonomy. To confirm one: browse to the category on
# ebay.com, filter to Sold, and read the `_sacat=` value out of the URL.
# `nflcarddb probe --query <id>` fetches a single page and prints the result
# count plus sample titles so you can sanity-check a category in one request.
#
# 261328 = Sports Trading Card Singles (the broad singles bucket).
# Narrowing to the football-only child category cuts your page count a lot.

database: data/nflcarddb.sqlite

# Optional: newline- or CSV-delimited player names. When present, the title
# parser matches against it and reports higher confidence on exact hits.
# roster: config/nfl_players.txt

fetch:
  # auto | impersonate | browser | requests
  #   auto        - walk the ladder below, sticking with whatever gets through
  #   impersonate - HTTP client with a real Chrome TLS fingerprint (fast)
  #   browser     - drive Chrome directly, automation markers removed (slower)
  #   requests    - plain Python HTTP; eBay 403s this on most connections
  #
  # eBay fingerprints the TLS handshake, so a plain client is refused before it
  # has sent a single HTTP header. That is why waiting never helped: the refusal
  # is not about rate. "impersonate" sends Chrome's actual handshake; "browser"
  # is Chrome.
  engine: auto
  # Reusing the everyday Chrome profile does NOT work: since Chrome 127 cookies
  # are bound to the Chrome process that wrote them, so a Chrome launched from
  # here cannot decrypt a session created from the desktop. Sign in through
  # login.bat instead -- that profile is written and read by the same launcher,
  # which is what makes it reusable.
  chrome_profile: false
  # Seconds between the START of one request and the next (jitter is added).
  # Page load time counts toward it, so this is the request rate eBay sees.
  delay: 2.5
  jitter: 1.0
  max_retries: 4
  timeout: 30
  # Hard ceiling on requests per run -- the safety valve. Reaching an older day
  # costs pages roughly in proportion to how far back it is, so a budget that
  # comfortably collects yesterday silently truncates a day three weeks back.
  # 3000 covers most of the window; `nflcarddb recheck` finds any day it didn't.
  page_budget: 3000
  items_per_page: 240     # 60 | 120 | 240
  max_pages_per_segment: 42
  max_subdivide_depth: 3

# Price bands exist to beat eBay's ~10k-results-per-search cap. Any band that
# comes back capped is split automatically at its geometric midpoint.
price_bands:
  - [null, 10]
  - [10, 25]
  - [25, 50]
  - [50, 100]
  - [100, 250]
  - [250, 1000]
  - [1000, null]

queries:
  # ---------------------------------------------------------------------------
  # COVERAGE. Each query is a separate eBay search, walked independently, and
  # item_id is the primary key -- so queries may overlap freely. A listing found
  # twice is stored once. Adding a query costs time, never duplicate data.
  #
  # BUT: verify a new query returns anything before trusting a run to it.
  #   nflcarddb url --query <id>      prints the URL; paste it in a browser
  #   nflcarddb survey                asks eBay how big each one is
  # An `extra:` filter that eBay does not accept in that form returns zero
  # results rather than an error, which is exactly how a working query got
  # replaced with an empty one here.
  # ---------------------------------------------------------------------------

  # The proven one: this collected ~23,000 sales a day for weeks. eBay matches
  # far more than the title -- only ~5% of the results contain the word
  # "football" -- so the keyword is reaching category and item-specifics too.
  - id: football_singles
    keywords: football
    category: "261328"

  # Lots and sets are a different category, so the singles search never sees
  # them. Same shape as the query above, which is why it is trusted here.
  # A lot price is not a card price -- "50 cards for $30" is not a $30 card.
  - id: football_lots
    keywords: football
    category: "261329"

  # Graded cards: same card, known condition, comparable prices. Runs alone
  # (`--query football_graded`) as a fast daily pass when time is short.
  - id: football_graded
    keywords: football psa
    category: "261328"
    price_bands:
      - [null, 50]
      - [50, 250]
      - [250, null]

  # Broader wording, for listings titled "NFL" rather than "football".
  - id: nfl_singles
    keywords: nfl card
    category: "261328"
