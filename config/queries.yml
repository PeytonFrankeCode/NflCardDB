# NflCardDB scrape configuration.
#
# VERIFY THE CATEGORY IDS BEFORE YOUR FIRST REAL RUN.
# eBay reshuffles its taxonomy. To confirm one: browse to the category on
# ebay.com, filter to Sold, and read the `_sacat=` value out of the URL.
# `nflcarddb probe --query <id>` fetches a single page and prints the result
# count plus sample titles so you can sanity-check a category in one request.
#
# 261328 = Sports Trading Card Singles (the broad singles bucket).
# Narrowing to the football-only child category cuts your page count a lot.

database: data/nflcarddb.sqlite

# What a sale is filed under when neither its search nor its title says which
# sport it is. Everything collected before sports were separated is football,
# so this describes the data that exists rather than stating a preference.
#
# It is also the sport left UNMARKED in card keys: a football card keys as
# `2024-prizm-n1` and a basketball one as `basketball-2024-prizm-n1`. That
# asymmetry is deliberate. Sport detection reads titles, titles are
# inconsistent, and stamping a detected value into every key would split a
# working card the moment one of its sales failed to mention a team. Changing
# this re-keys the whole database, so it is a decision rather than a dial.
default_sport: football

# Optional: newline- or CSV-delimited player names. When present, the title
# parser matches against it and reports higher confidence on exact hits.
roster: config/nfl_players.txt

fetch:
  # auto | impersonate | browser | requests
  #   auto        - walk the ladder below, sticking with whatever gets through
  #   impersonate - HTTP client with a real Chrome TLS fingerprint (fast)
  #   browser     - drive Chrome directly, automation markers removed (slower)
  #   requests    - plain Python HTTP; eBay 403s this on most connections
  #
  # eBay fingerprints the TLS handshake, so a plain client is refused before it
  # has sent a single HTTP header. That is why waiting never helped: the refusal
  # is not about rate. "impersonate" sends Chrome's actual handshake; "browser"
  # is Chrome.
  engine: auto
  # Reusing the everyday Chrome profile does NOT work: since Chrome 127 cookies
  # are bound to the Chrome process that wrote them, so a Chrome launched from
  # here cannot decrypt a session created from the desktop. Sign in through
  # login.bat instead -- that profile is written and read by the same launcher,
  # which is what makes it reusable.
  chrome_profile: false
  # Seconds between the START of one request and the next (jitter is added).
  # Page load time counts toward it, so this is the request rate eBay sees.
  #
  # This is the second-biggest lever on run length, and the only one with a
  # downside you cannot see coming: a bot check costs far more time than the
  # delay saves, and a session signed out by one costs the whole night. So it
  # is left where it has been proven to work.
  #
  # To try it: set delay 1.5 / jitter 0.5 for ONE night, then compare
  # `bot_checks` and `seconds_lost_to_bot_checks` in the run log against a
  # normal night. Keep it only if both are still zero. `nflcarddb speed`
  # prints what each setting would cost in hours, measured rather than
  # assumed -- part of each page is eBay's load time and no delay reclaims it.
  delay: 2.5
  jitter: 1.0
  max_retries: 4
  timeout: 30
  # Hard ceiling on requests per run -- the safety valve. Reaching an older day
  # costs pages roughly in proportion to how far back it is, so a budget that
  # comfortably collects yesterday silently truncates a day three weeks back.
  # 3000 covers most of the window; `nflcarddb recheck` finds any day it didn't.
  page_budget: 3000
  items_per_page: 240     # 60 | 120 | 240
  max_pages_per_segment: 42
  max_subdivide_depth: 3

# Price bands exist to beat eBay's ~10k-results-per-search cap. Any band that
# comes back capped is split automatically at its geometric midpoint.
price_bands:
  - [null, 10]
  - [10, 25]
  - [25, 50]
  - [50, 100]
  - [100, 250]
  - [250, 1000]
  - [1000, null]

queries:
  # ---------------------------------------------------------------------------
  # COVERAGE. Each query is a separate eBay search, walked independently, and
  # item_id is the primary key -- so queries may overlap freely. A listing found
  # twice is stored once. Adding a query costs time, never duplicate data.
  #
  # BUT: verify a new query returns anything before trusting a run to it.
  #   nflcarddb url --query <id>      prints the URL; paste it in a browser
  #   nflcarddb survey                asks eBay how big each one is
  # An `extra:` filter that eBay does not accept in that form returns zero
  # results rather than an error, which is exactly how a working query got
  # replaced with an empty one here.
  # ---------------------------------------------------------------------------

  # `sport:` is stamped on every sale a search finds, and it is what keeps
  # three different cards called "2024 Prizm #1" apart. Panini and Topps print
  # the same set names in every sport they licence, and most sellers never type
  # which sport it is, so the search that found a sale is the only answer that
  # is the same for every sale of one card. A query with no `sport:` gets
  # `default_sport` above.

  # The proven one: this collected ~23,000 sales a day for weeks. eBay matches
  # far more than the title -- only ~5% of the results contain the word
  # "football" -- so the keyword is reaching category and item-specifics too.
  - id: football_singles
    keywords: football
    category: "261328"
    sport: football

  # eBay's Lots category (261329) was collected here and is not any more.
  # A lot price is not a card price -- "50 cards for $30" is not a $30 card --
  # so every row it returned was stored, parsed, uploaded, and then refused a
  # card_key. That is a whole category walked, every price band, for data
  # nothing could use. Add it back only if lots become interesting in
  # themselves rather than as comparables.

  # Graded cards: same card, known condition, comparable prices. Runs alone
  # (`--query football_graded`) as a fast daily pass when time is short.
  - id: football_graded
    keywords: football psa
    category: "261328"
    sport: football
    price_bands:
      - [null, 50]
      - [50, 250]
      - [250, null]

  # TURNED OFF after being measured. "nfl card" walked all seven price bands
  # every run -- about a seventh of the whole run -- to contribute 1.4% of the
  # sales, and those 1.4% are mostly ones `football_singles` would have found
  # on a day it was not cut short. eBay matches the category and the item
  # specifics, not only the words, so a second phrasing of the same search
  # re-finds the first's results and pays full price for them.
  #
  # `nflcarddb speed` is what measured it and will measure it again. Uncomment
  # if that report ever shows it earning its pages.
  # - id: nfl_singles
  #   keywords: nfl card
  #   category: "261328"
  #   sport: football

  # ---------------------------------------------------------------------------
  # BASKETBALL. Same category -- 261328 is Sports Trading Card Singles, every
  # sport -- so only the keywords and the stamped sport differ.
  #
  # ON BY DEFAULT but VERIFY BEFORE TRUSTING A RUN TO THEM:
  #   nflcarddb survey                 asks eBay how big each search is
  #   nflcarddb probe --query nba_singles    one page, with its titles
  # A query eBay does not like returns zero results rather than an error, so
  # an unverified one fails silently and the run still reports "ok".
  #
  # Each added query lengthens a run. Three sports is roughly three times the
  # work of one, and the nightly window is what it is -- if runs stop
  # finishing, `nflcarddb leaks` will say so as UNREACHED bands, and the
  # answer is to drop a query rather than to raise the budget forever.
  - id: basketball_singles
    keywords: basketball
    category: "261328"
    sport: basketball

  # Off for the same reason, and before it had a chance to cost a fortnight:
  # "nba card" against "basketball" is the exact structure that made
  # nfl_singles 1.4% of the data for a seventh of the run. Measure with
  # `nflcarddb speed` before turning it back on.
  # - id: nba_singles
  #   keywords: nba card
  #   category: "261328"
  #   sport: basketball

  # Graded basketball on its own, for the same reason football has one: same
  # card, known condition, comparable prices.
  - id: basketball_graded
    keywords: basketball psa
    category: "261328"
    sport: basketball
    price_bands:
      - [null, 50]
      - [50, 250]
      - [250, null]

  # ---------------------------------------------------------------------------
  # BASEBALL.
  - id: baseball_singles
    keywords: baseball
    category: "261328"
    sport: baseball

  # Off, as above.
  # - id: mlb_singles
  #   keywords: mlb card
  #   category: "261328"
  #   sport: baseball

  - id: baseball_graded
    keywords: baseball psa
    category: "261328"
    sport: baseball
    price_bands:
      - [null, 50]
      - [50, 250]
      - [250, null]

  # ---------------------------------------------------------------------------
  # MORE REACH. Uncomment any of these to collect more.
  #
  # Three searches cannot see all of eBay's football. The ceiling is not the
  # collector's speed -- it is that eBay will not page ANY single search past
  # about 10,000 results, so the only way to see more is to ask in more ways.
  # `nflcarddb leaks` reports which of the current searches are hitting that
  # wall; these are aimed at what no search asks for at all.
  #
  # Each one costs time, never duplicate data: item_id is the primary key, so
  # a listing found twice is stored once. Adding four queries roughly doubles
  # a run's length, so enable them a couple at a time and watch the clock.
  #
  # Before trusting a new one, check it returns anything:
  #   nflcarddb survey            asks eBay how big each enabled query is
  #   nflcarddb probe --query <id>   fetches one page and prints the titles
  # An `extra:` filter eBay does not accept returns zero results rather than
  # an error, which is exactly how a working query got replaced by an empty
  # one here once already.
  #
  # Brand-led, for listings whose titles name the product and never the sport.
  # "2024 Prizm Caleb Williams RC PSA 10" contains neither "football" nor
  # "NFL", and those are the majority of modern listings.
  # - id: panini_singles
  #   keywords: panini football
  #   category: "261328"
  # - id: topps_singles
  #   keywords: topps football
  #   category: "261328"
  # - id: prizm_singles
  #   keywords: prizm football
  #   category: "261328"
  #
  # Rookie cards: the most traded slice of the market, and worth its own walk
  # because the broad searches hit the result wall before reaching all of it.
  # - id: rookie_singles
  #   keywords: football rookie rc
  #   category: "261328"
  #
  # Autographs and patches, which sit at prices the broad bands walk last and
  # therefore lose first when the page budget runs out.
  # - id: auto_singles
  #   keywords: football auto autograph
  #   category: "261328"
  # - id: patch_singles
  #   keywords: football patch relic jersey
  #   category: "261328"
designations: config/nfl_words.txt
sets: config/nfl_sets.txt
inserts: config/nfl_learned_inserts.txt
