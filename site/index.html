<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NflCardDB — eBay football card sales</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --series-1:       #2a78d6;
    --border:         rgba(11,11,11,0.10);
    --warn:           #ec835a;
    --up:             #1f7a4d;
    --down:           #b3402e;
    --selected:       rgba(42,120,214,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --series-1:       #3987e5;
      --border:         rgba(255,255,255,0.10);
      --up:             #4cb782;
      --down:           #e8735a;
      --selected:       rgba(57,135,229,0.16);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --series-1:       #3987e5;
    --border:         rgba(255,255,255,0.10);
    --up:             #4cb782;
    --down:           #e8735a;
    --selected:       rgba(57,135,229,0.16);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 64px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 28px; }
  .sub code { font-size: 12px; background: var(--surface-1); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.005em; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 16px; }

  /* KPI row */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .kpi .value { font-size: 26px; font-weight: 620; letter-spacing: -0.02em; line-height: 1.15; }
  .kpi .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .charts { grid-template-columns: 1fr; } }

  figure { margin: 0; }
  .plot { position: relative; }
  svg { display: block; width: 100%; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .series-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .series-dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
  .crosshair { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 3 3; }
  .hit { fill: transparent; }

  /* Horizontal bars */
  .bars { display: flex; flex-direction: column; gap: 7px; }
  .bar-row { display: grid; grid-template-columns: minmax(96px, 150px) 1fr auto; align-items: center; gap: 10px; cursor: default; }
  .bar-label { font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 15px; position: relative; }
  .bar-fill { height: 15px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; transition: opacity .12s; }
  .bar-row:hover .bar-fill { opacity: .82; }
  .bar-value { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; min-width: 74px; text-align: right; }

  /* Tooltip */
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
    white-space: nowrap; z-index: 5; color: var(--text-primary);
  }
  .tip .t-date { color: var(--text-secondary); margin-bottom: 3px; }
  .tip .t-val { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Table */
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  input[type=search] {
    flex: 1 1 240px; min-width: 180px; padding: 7px 11px; font: inherit; font-size: 13px;
    background: var(--page); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 7px;
  }
  input[type=search]:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
  label.chk { font-size: 12.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  /* The table scrolls inside its own box: 300 rows must not stretch the page. */
  .scroll-x { overflow: auto; max-height: 560px; overscroll-behavior: contain; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 550; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; background: var(--surface-1); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.title { white-space: normal; min-width: 260px; color: var(--text-secondary); }
  td a { color: var(--series-1); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .flag { font-size: 10.5px; color: var(--warn); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; }

  /* Listing photos. Fixed box so rows stay one height whatever eBay returns,
     and an empty box rather than a gap when a photo is missing or purged. */
  td.thumb { width: 52px; padding: 4px 6px 4px 10px; }
  td.thumb div { width: 42px; height: 42px; border-radius: 5px; border: 1px solid var(--border); background: var(--page); overflow: hidden; }
  td.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  td.thumb img.gone { display: none; }

  /* One card, over time. The list picks; the panel beside it draws.
     Both halves scroll independently so a 2,000-row list never pushes the
     chart off the bottom of the screen. */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }

  .clist { overflow: auto; max-height: 460px; overscroll-behavior: contain; border: 1px solid var(--border); border-radius: 8px; }
  .crow {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
    padding: 8px 11px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .crow:last-child { border-bottom: 0; }
  .crow:hover { background: var(--page); }
  .crow[aria-selected="true"] { background: var(--selected); }
  .crow .cname { font-size: 13px; line-height: 1.35; }
  .crow .cmeta { font-size: 11.5px; color: var(--muted); grid-column: 1; }
  .crow .cprice { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; align-self: start; }
  .crow .ctrend { font-size: 11.5px; font-variant-numeric: tabular-nums; text-align: right; }
  .up { color: var(--up); }
  .down { color: var(--down); }

  .detail-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .detail-head .shot { width: 62px; height: 62px; flex: none; border-radius: 6px; border: 1px solid var(--border); background: var(--page); overflow: hidden; }
  .detail-head .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-head .shot img.gone { display: none; }
  .detail-head h3 { font-size: 15px; font-weight: 600; margin: 0 0 3px; line-height: 1.3; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12px; color: var(--text-secondary); margin: 0; }
  .stats b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  select { font: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); }

  .empty { text-align: center; padding: 44px 20px; color: var(--text-secondary); }
  .empty h2 { font-size: 16px; margin-bottom: 10px; }
  .empty pre {
    display: inline-block; text-align: left; background: var(--page); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; font-size: 12.5px; margin-top: 8px; overflow-x: auto; max-width: 100%;
  }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>NflCardDB</h1></header>
  <p class="sub" id="sub">Loading…</p>
  <div id="app"></div>
  <footer id="foot"></footer>
</div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const fmtInt = n => (n ?? 0).toLocaleString("en-US");
const fmtUsd = n => n == null ? "—" : "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtUsd0 = n => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
const fmtDay = iso => {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadJson(name) {
  const res = await fetch(`data/${name}?v=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
  return res.json();
}

/* ---------- charts ---------- */

// Chart geometry lives in ONE place: the static render and the hover layer must
// share a scale, or the crosshair drifts off the line the moment either changes.
const GEO = { W: 560, H: 200, ml: 52, mr: 12, mt: 12, mb: 26 };

// Pick round tick values that fit the data snugly. Fixing the tick count first
// and rounding the step up from there overshoots badly (max 420 -> axis to 800,
// which flattens the line into the bottom half). Instead let the count float
// between 3 and 6 and take the combination whose top sits closest above the max.
function niceScale(max) {
  if (!(max > 0)) return { top: 1, step: 0.25, ticks: 4 };
  const mag = Math.pow(10, Math.floor(Math.log10(max)));
  let best = null;
  for (const scale of [mag / 100, mag / 10, mag, mag * 10]) {
    for (const mult of [1, 2, 2.5, 5, 10]) {
      const step = scale * mult;
      if (step <= 0) continue;
      const ticks = Math.ceil(max / step - 1e-9);
      if (ticks < 3 || ticks > 6) continue;
      const top = step * ticks;
      if (!best || top < best.top) best = { top, step, ticks };
    }
  }
  // Fall back to a plain 4-tick split if nothing landed in the window.
  return best || { top: max, step: max / 4, ticks: 4 };
}

function lineGeom(rows, x, y) {
  const { W, H, ml, mr, mt, mb } = GEO;
  const pts = rows.map(r => ({ x: x(r), y: y(r), row: r })).filter(p => p.y != null);
  const iw = W - ml - mr, ih = H - mt - mb;
  const { top, step, ticks } = niceScale(pts.length ? Math.max(...pts.map(p => p.y)) : 0);
  return {
    pts, iw, ih, top, step, ticks,
    sx: i => ml + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw),
    sy: v => mt + ih - (v / top) * ih,
  };
}

// Single-series line. No legend by design: the title names the series.
function lineChart({ rows, x, y, format }) {
  const { W, H, ml, mr, mt } = GEO;
  const g = lineGeom(rows, x, y);
  const { pts, iw, ih, sx, sy } = g;
  if (pts.length === 0) return `<p class="note">No priced sales yet in this range.</p>`;

  let grid = "", ticks = "";
  for (let i = 0; i <= g.ticks; i++) {
    const v = i * g.step;
    const yy = sy(v);
    grid += `<line class="grid-line" x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}"/>`;
    ticks += `<text class="tick" x="${ml - 8}" y="${yy + 4}" text-anchor="end">${format(v, true)}</text>`;
  }

  const path = pts.map((p, i) => `${i ? "L" : "M"}${sx(i).toFixed(1)},${sy(p.y).toFixed(1)}`).join("");
  // Label only the ends — never a number on every point.
  const xLabels = pts.length === 1
    ? `<text class="tick" x="${sx(0)}" y="${H - 6}" text-anchor="middle">${fmtDay(pts[0].x)}</text>`
    : `<text class="tick" x="${ml}" y="${H - 6}">${fmtDay(pts[0].x)}</text>
       <text class="tick" x="${W - mr}" y="${H - 6}" text-anchor="end">${fmtDay(pts[pts.length - 1].x)}</text>`;

  const dots = pts.length <= 40
    ? pts.map((p, i) => `<circle class="series-dot" cx="${sx(i).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="4"/>`).join("")
    : "";

  return `
    <div class="plot">
      <svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">
        ${grid}${ticks}
        <line class="axis-line" x1="${ml}" x2="${W - mr}" y1="${mt + ih}" y2="${mt + ih}"/>
        <path class="series-line" d="${path}"/>
        ${dots}
        ${xLabels}
        <g class="hover-layer"></g>
        <rect class="hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}"/>
      </svg>
      <div class="tip"></div>
    </div>`;
}

function attachLineHover(root, { rows, x, y, format }) {
  const svg = $("svg", root);
  if (!svg) return;
  const hit = $(".hit", svg), tip = $(".tip", root), layer = $(".hover-layer", svg);
  const { W, H, mt } = GEO;
  const { pts, ih, sx, sy } = lineGeom(rows, x, y);
  if (!pts.length) return;

  const move = ev => {
    const box = svg.getBoundingClientRect();
    const px = ((ev.clientX - box.left) / box.width) * W;
    let idx = 0, best = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(sx(i) - px); if (d < best) { best = d; idx = i; } });
    const p = pts[idx];
    layer.innerHTML =
      `<line class="crosshair" x1="${sx(idx)}" x2="${sx(idx)}" y1="${mt}" y2="${mt + ih}"/>
       <circle class="series-dot" cx="${sx(idx)}" cy="${sy(p.y)}" r="5.5"/>`;
    tip.innerHTML = `<div class="t-date">${fmtDay(p.x)}</div><div class="t-val">${format(p.y)}</div>`;
    tip.style.opacity = "1";
    const left = (sx(idx) / W) * box.width;
    tip.style.left = Math.min(Math.max(left - 46, 0), box.width - 110) + "px";
    tip.style.top = ((sy(p.y) / H) * box.height - 48) + "px";
  };
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", () => { tip.style.opacity = "0"; layer.innerHTML = ""; });
}

// Horizontal bars, one hue: length carries magnitude. Every bar is direct-labeled.
function barList(rows, { label, value, display, sub }) {
  if (!rows.length) return `<p class="note">Nothing to show yet.</p>`;
  const max = Math.max(...rows.map(value));
  return `<div class="bars">` + rows.map(r => {
    const pct = max ? (value(r) / max) * 100 : 0;
    return `<div class="bar-row" title="${esc(sub ? sub(r) : label(r))}">
      <div class="bar-label">${esc(label(r))}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="bar-value">${display(r)}</div>
    </div>`;
  }).join("") + `</div>`;
}

/* ---------- table ---------- */

let tableState = { rows: [], confirmedOnly: false, query: "" };

function renderTable() {
  const q = tableState.query.trim().toLowerCase();
  let rows = tableState.rows;
  // Off by default: best offers count. Ticking it leaves only prices
  // someone actually paid.
  if (tableState.confirmedOnly) rows = rows.filter(r => r.bo === 0 && r.cur === "USD");
  if (q) rows = rows.filter(r =>
    (r.t || "").toLowerCase().includes(q) ||
    (r.player || "").toLowerCase().includes(q) ||
    (r.set || "").toLowerCase().includes(q) ||
    (r.team || "").toLowerCase().includes(q));

  const shown = rows.slice(0, 300);
  $("#rowcount").textContent =
    `${fmtInt(rows.length)} row${rows.length === 1 ? "" : "s"}` +
    (rows.length > shown.length ? ` (showing first ${shown.length})` : "");

  $("#tbody").innerHTML = shown.map(r => `
    <tr>
      <td class="thumb"><div>${r.img
        ? `<img src="${esc(r.img)}" alt="" loading="lazy" decoding="async">` : ""}</div></td>
      <td>${fmtDay(r.d)}</td>
      <td>${esc(r.player || "—")}</td>
      <td>${esc(r.set || "—")}${r.par ? " · " + esc(r.par) : ""}</td>
      <td>${esc(r.g || "Raw")}</td>
      <td class="num">${r.cur === "USD" ? fmtUsd(r.p) : esc(r.cur) + " " + fmtUsd(r.p).slice(1)}${
        r.bo ? '<span class="flag" title="Asking price. eBay does not publish what the buyer paid on an accepted offer, so this is above the real sale price.">ask</span>' : ""}</td>
      <td class="title"><a href="https://www.ebay.com/itm/${esc(r.id)}" target="_blank" rel="noopener">${esc(r.t)}</a></td>
    </tr>`).join("") || `<tr><td colspan="7" style="color:var(--muted)">No rows match.</td></tr>`;
}

/* ---------- one card, over time ---------- */

// The whole point of the identity layer: many listings for the same physical
// card, gathered under one name, so a price becomes a history.
let cardState = { rows: [], query: "", selected: null, grade: "" };

// Mirrors publish.py's _trend, so filtering to one grade still gets a number
// instead of a dash. Halves rather than endpoints: a single unusual sale at
// either end would otherwise be the whole trend. Four sales minimum, because
// two points make a line through anything.
const MIN_SALES_FOR_TREND = 4;
const med = xs => {
  if (!xs.length) return null;
  const s = [...xs].sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
function trendOf(prices) {
  if (prices.length < MIN_SALES_FOR_TREND) return null;
  const middle = prices.length >> 1;
  const older = med(prices.slice(0, middle)), newer = med(prices.slice(middle));
  if (!older) return null;
  return Math.round(1000 * (newer - older) / older) / 10;
}

const trendHtml = t => t == null
  ? `<span class="ctrend" style="color:var(--muted)">—</span>`
  : `<span class="ctrend ${t >= 0 ? "up" : "down"}">${t >= 0 ? "+" : ""}${t.toFixed(1)}%</span>`;

function matchingCards() {
  const q = cardState.query.trim().toLowerCase();
  if (!q) return cardState.rows;
  // Every word must appear somewhere, in any order: "prizm silver williams"
  // should find the card however the name happens to be ordered.
  const words = q.split(/\s+/);
  return cardState.rows.filter(c => {
    const hay = `${c.name} ${c.player || ""} ${c.set || ""}`.toLowerCase();
    return words.every(w => hay.includes(w));
  });
}

function renderCardList() {
  const rows = matchingCards();
  const shown = rows.slice(0, 400);
  $("#cardcount").textContent =
    `${fmtInt(rows.length)} card${rows.length === 1 ? "" : "s"}` +
    (rows.length > shown.length ? ` (showing first ${shown.length})` : "");

  $("#cardlist").innerHTML = shown.map(c => `
    <div class="crow" role="option" tabindex="0" data-key="${esc(c.key)}"
         aria-selected="${c.key === cardState.selected ? "true" : "false"}">
      <div class="cname">${esc(c.name)}</div>
      <div class="cprice">${fmtUsd0(c.median)}</div>
      <div class="cmeta">${fmtInt(c.n)} sales · ${esc(fmtDay(c.first))} → ${esc(fmtDay(c.last))}</div>
      ${trendHtml(c.trend)}
    </div>`).join("") ||
    `<div style="padding:16px;color:var(--muted);font-size:13px">No card matches.</div>`;
}

function selectCard(key) {
  cardState.selected = key;
  cardState.grade = "";           // a grade from the last card may not exist here
  renderCardList();
  renderCardDetail();
  const row = $(`.crow[data-key="${CSS.escape(key)}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}

function renderCardDetail() {
  const card = cardState.rows.find(c => c.key === cardState.selected);
  const box = $("#carddetail");
  if (!card) {
    box.innerHTML = `<p class="note">Pick a card on the left to see its price history.</p>`;
    return;
  }

  // Grades are separate markets for the same cardboard. Mixing a PSA 10 into
  // a raw card's line draws a trend that describes neither, so the line is one
  // grade at a time once there is more than one to choose between.
  const counts = new Map();
  card.sales.forEach(s => counts.set(s[2], (counts.get(s[2]) || 0) + 1));
  const grades = [...counts.entries()].sort((a, b) => b[1] - a[1]);

  const sales = cardState.grade
    ? card.sales.filter(s => s[2] === cardState.grade)
    : card.sales;
  const rows = sales.map(s => ({ d: s[0], p: s[1], g: s[2] }));
  const ordered = rows.map(r => r.p);                       // oldest first
  const prices = [...ordered].sort((a, b) => a - b);
  // Unfiltered, the published number stands. Filtered, it is recomputed here
  // for the grade actually on screen.
  const trend = cardState.grade ? trendOf(ordered) : card.trend;

  box.innerHTML = `
    <div class="detail-head">
      ${card.img ? `<div class="shot"><img src="${esc(card.img)}" alt="" loading="lazy" decoding="async"></div>` : ""}
      <div>
        <h3>${esc(card.name)}</h3>
        <p class="stats">
          <span><b>${fmtInt(rows.length)}</b> sales</span>
          <span>median <b>${fmtUsd(med(prices))}</b></span>
          <span>low <b>${fmtUsd(prices[0] ?? null)}</b></span>
          <span>high <b>${fmtUsd(prices[prices.length - 1] ?? null)}</b></span>
          <span>trend ${trendHtml(trend)}</span>
        </p>
      </div>
    </div>
    ${grades.length > 1 ? `
    <div class="controls">
      <select id="cgrade">
        <option value="">All grades (${fmtInt(card.sales.length)} sales)</option>
        ${grades.map(([g, n]) =>
          `<option value="${esc(g)}"${g === cardState.grade ? " selected" : ""}>${esc(g)} (${fmtInt(n)})</option>`).join("")}
      </select>
      <span class="note" style="margin:0">A graded copy and a raw one are different markets.</span>
    </div>` : ""}
    <div id="c-card">${lineChart({
      rows, x: r => r.d, y: r => r.p,
      format: (v, ax) => ax ? "$" + Math.round(v) : fmtUsd(v),
    })}</div>
    <p class="note" style="margin-top:8px">One dot per sale, oldest to newest. Points are spaced evenly by sale, not by calendar — hover for the date.</p>`;

  attachLineHover($("#c-card"), {
    rows, x: r => r.d, y: r => r.p,
    format: v => fmtUsd(v),
  });
  const sel = $("#cgrade");
  if (sel) sel.addEventListener("change", e => { cardState.grade = e.target.value; renderCardDetail(); });
}

function cardsSection(cards) {
  if (!cards.length) return "";
  return `
    <div class="card">
      <h2>One card, over time</h2>
      <p class="note">Every listing that is the same physical card, gathered under one name — so its
        sales become a price history instead of a pile of separate rows. Cards with only one sale
        are left out: one price is not a trend.</p>
      <div class="controls">
        <input type="search" id="cardq" placeholder="Search cards — e.g. Caleb Williams Silver, Prizm 2024…" autocomplete="off">
        <span class="note" id="cardcount" style="margin:0"></span>
      </div>
      <div class="split">
        <div class="clist" id="cardlist" role="listbox" aria-label="Cards"></div>
        <div id="carddetail"></div>
      </div>
    </div>`;
}

/* ---------- page ---------- */

function emptyState(reason) {
  $("#sub").textContent = "No data published yet.";
  $("#app").innerHTML = `
    <div class="card empty">
      <h2>Nothing to show yet</h2>
      <p>${esc(reason)}</p>
      <p>Scrape on a machine that can reach eBay, publish the JSON, and push:</p>
      <pre>nflcarddb scrape --date $(date -d yesterday +%F)
nflcarddb publish
git add site/data &amp;&amp; git commit -m "data update" &amp;&amp; git push</pre>
    </div>`;
}

async function main() {
  let meta, daily, players, grades, sets, recent;
  try {
    [meta, daily, players, grades, sets, recent] = await Promise.all(
      ["meta.json", "daily.json", "players.json", "grades.json", "sets.json", "recent.json"].map(loadJson));
  } catch (err) {
    emptyState(`Could not load data/ (${err.message}).`);
    return;
  }
  // Newer than the rest of the files. A site published before card grouping
  // existed has no cards.json, and that should cost it one section rather than
  // the whole page.
  const cards = await loadJson("cards.json").catch(() => []);
  if (!meta.total_sales) { emptyState("The database is published but contains no sales."); return; }

  const gen = new Date(meta.generated_at);
  $("#sub").innerHTML =
    `${fmtInt(meta.total_sales)} sales · ${esc(meta.date_min || "?")} → ${esc(meta.date_max || "?")} · ` +
    `published ${esc(gen.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }))}`;

  const boPct = meta.total_sales ? (meta.best_offer_sales / meta.total_sales) * 100 : 0;

  $("#app").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Sales tracked</div><div class="value">${fmtInt(meta.total_sales)}</div>
        <div class="meta">${fmtInt(meta.days_covered)} day${meta.days_covered === 1 ? "" : "s"}</div></div>
      <div class="kpi"><div class="label">Latest day</div><div class="value">${fmtInt(meta.latest_day_sales)}</div>
        <div class="meta">${esc(fmtDay(meta.date_max))}</div></div>
      <div class="kpi"><div class="label">Median price</div><div class="value">${fmtUsd0(meta.median_price)}</div>
        <div class="meta">${fmtInt(meta.priced_sales)} with a price</div></div>
      <div class="kpi"><div class="label">90th pct</div><div class="value">${fmtUsd0(meta.p90_price)}</div>
        <div class="meta">USD, best offers included</div></div>
      <div class="kpi"><div class="label">Priced as asks</div><div class="value">${boPct.toFixed(1)}%</div>
        <div class="meta">price is the ask</div></div>
    </div>

    <div class="charts">
      <div class="card"><figure>
        <h2>Sales per day</h2>
        <p class="note">Every listing collected, including best-offer rows.</p>
        <div id="c-vol">${lineChart({ rows: daily, x: r => r.d, y: r => r.n, format: (v, ax) => ax ? Math.round(v).toLocaleString("en-US") : fmtInt(Math.round(v)) + " sales" })}</div>
      </figure></div>

      <div class="card"><figure>
        <h2>Median sale price</h2>
        <p class="note">USD only, best offers included — their price is the ask, so this reads above true sale prices.</p>
        <div id="c-med">${lineChart({ rows: daily, x: r => r.d, y: r => r.median, format: (v, ax) => ax ? "$" + Math.round(v) : fmtUsd(v) })}</div>
      </figure></div>
    </div>

    ${cardsSection(cards)}

    <div class="charts">
      <div class="card"><figure>
        <h2>Most-traded players</h2>
        <p class="note">By number of priced sales. Confident parses only.</p>
        ${barList(players.slice(0, 12), {
          label: r => r.player, value: r => r.n,
          display: r => `${fmtInt(r.n)} · ${fmtUsd0(r.median)}`,
          sub: r => `${r.player}${r.team ? " — " + r.team : ""}: ${r.n} sales, median ${fmtUsd(r.median)}, max ${fmtUsd(r.max)}`,
        })}
      </figure></div>

      <div class="card"><figure>
        <h2>Grade mix</h2>
        <p class="note">Sale count by grade, with median price.</p>
        ${barList(grades.slice(0, 12), {
          label: r => r.grade, value: r => r.n,
          display: r => `${fmtInt(r.n)} · ${fmtUsd0(r.median)}`,
          sub: r => `${r.grade}: ${r.n} sales, median ${fmtUsd(r.median)}`,
        })}
      </figure></div>
    </div>

    <div class="card"><figure>
      <h2>Top sets</h2>
      <p class="note">Sale count by set, with median price.</p>
      ${barList(sets.slice(0, 10), {
        label: r => r.set, value: r => r.n,
        display: r => `${fmtInt(r.n)} · ${fmtUsd0(r.median)}`,
        sub: r => `${r.set}: ${r.n} sales, median ${fmtUsd(r.median)}`,
      })}
    </figure></div>

    <div class="card">
      <h2>Recent sales</h2>
      <p class="note">The underlying rows. Search matches title, player, set, or team.</p>
      <div class="controls">
        <input type="search" id="q" placeholder="Search — e.g. Stroud, Prizm, PSA 10…" autocomplete="off">
        <label class="chk"><input type="checkbox" id="usd"> Confirmed sale prices only (hide best offers)</label>
        <span class="note" id="rowcount" style="margin:0"></span>
      </div>
      <div class="scroll-x">
        <table>
          <thead><tr><th></th><th>Sold</th><th>Player</th><th>Set</th><th>Grade</th><th style="text-align:right">Price</th><th>Listing</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>`;

  attachLineHover($("#c-vol"), { rows: daily, x: r => r.d, y: r => r.n, format: v => fmtInt(Math.round(v)) + " sales" });
  attachLineHover($("#c-med"), { rows: daily, x: r => r.d, y: r => r.median, format: v => fmtUsd(v) });

  if (cards.length) {
    cardState.rows = cards;
    const list = $("#cardlist");
    // One listener on the container: the rows are re-rendered on every search
    // keystroke, and per-row listeners would be re-bound each time.
    const pick = ev => {
      const row = ev.target.closest(".crow");
      if (row) selectCard(row.dataset.key);
    };
    list.addEventListener("click", pick);
    list.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(ev); }
    });
    // A missing photo shows nothing rather than a broken-image icon.
    $("#carddetail").addEventListener("error", e => {
      if (e.target.tagName === "IMG") e.target.classList.add("gone");
    }, true);
    $("#cardq").addEventListener("input", e => { cardState.query = e.target.value; renderCardList(); });
    // Open on the busiest card rather than an empty panel: the list is already
    // sorted by how much history each card has.
    cardState.selected = cards[0].key;
    renderCardList();
    renderCardDetail();
  }

  tableState.rows = recent;
  // eBay purges photos for old listings, so some src values 404. Hide those
  // rather than showing a broken-image icon. `error` does not bubble; capture.
  $("#tbody").addEventListener("error", e => {
    if (e.target.tagName === "IMG") e.target.classList.add("gone");
  }, true);
  $("#q").addEventListener("input", e => { tableState.query = e.target.value; renderTable(); });
  $("#usd").addEventListener("change", e => { tableState.confirmedOnly = e.target.checked; renderTable(); });
  renderTable();

  const lr = meta.last_run;
  $("#foot").textContent = lr
    ? `Last scrape ${lr.target_date || "?"} — ${lr.status}, ${fmtInt(lr.items_seen)} seen / ${fmtInt(lr.items_new)} new across ${fmtInt(lr.pages_fetched)} pages.`
    : "";
}

main();
</script>
</body>
</html>
