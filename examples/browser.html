<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NflCardDB - card price lookup</title>
<style>
 body{font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;
      margin:0 auto;padding:32px 20px;color:#0b0b0b;background:#f9f9f7}
 h1{font-size:20px;margin:0 0 16px}
 .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
 input,select,button{font:inherit;font-size:14px;padding:8px 11px;
      border:1px solid rgba(11,11,11,.15);border-radius:7px;background:#fff}
 button{background:#2a78d6;color:#fff;border-color:#2a78d6;cursor:pointer;font-weight:600}
 .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
 .stat{background:#fff;border:1px solid rgba(11,11,11,.1);border-radius:9px;padding:12px 14px}
 .stat .k{font-size:12px;color:#52514e}
 .stat .v{font-size:22px;font-weight:620;font-variant-numeric:tabular-nums}
 table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:22px}
 th,td{text-align:left;padding:7px 9px;border-bottom:1px solid rgba(11,11,11,.1)}
 th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#898781}
 td.n{text-align:right;font-variant-numeric:tabular-nums}
 .msg{padding:12px 14px;border-radius:8px;background:#fff;border:1px solid rgba(11,11,11,.1)}
 @media(prefers-color-scheme:dark){
   body{background:#0d0d0d;color:#fff}
   input,select,.stat,.msg{background:#1a1a19;color:#fff;border-color:rgba(255,255,255,.12)}
   th,td{border-color:rgba(255,255,255,.1)}}
</style>
</head>
<body>
<h1>Card price lookup</h1>

<div class="row">
  <input id="player" placeholder="Player name, e.g. CJ Stroud" size="24">
  <select id="grade">
    <option value="">Any grade</option>
    <option value="PSA|10">PSA 10</option>
    <option value="PSA|9">PSA 9</option>
    <option value="BGS|9.5">BGS 9.5</option>
  </select>
  <button id="go">Look up</button>
</div>

<div id="out" class="msg">Enter a player and press Look up.</div>

<script>
// ---------------------------------------------------------------------------
// Replace these two lines with your own values.
//
// IMPORTANT: this key is visible to anyone who views the page source. That is
// unavoidable -- the browser has to know it to send it. Use a key you are happy
// to have public, with a small daily quota. If you need the key kept secret,
// call the API from your server instead: see server-node.js.
// ---------------------------------------------------------------------------
const API  = "https://nflcarddb-api.YOUR-NAME.workers.dev";
const KEY  = "nfl_your_public_key_here";

const $ = (id) => document.getElementById(id);
const money = (n) => n == null ? "—" : "$" + n.toLocaleString("en-US",
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function api(path) {
  const res = await fetch(API + path, { headers: { Authorization: "Bearer " + KEY } });
  if (res.status === 429) throw new Error("Daily request limit reached — try again tomorrow.");
  if (res.status === 401 || res.status === 403) throw new Error("API key rejected.");
  if (!res.ok) throw new Error("Request failed (" + res.status + ")");
  return res.json();
}

async function lookup() {
  const player = $("player").value.trim();
  if (!player) return;

  const [grader, grade] = ($("grade").value || "|").split("|");
  const gradeQs = grader ? `&grader=${grader}&grade=${grade}` : "";
  $("out").className = "msg";
  $("out").textContent = "Looking up…";

  try {
    // Two calls: the summary stats, and recent sales to show underneath.
    const [stats, recent] = await Promise.all([
      api(`/v1/prices?player=${encodeURIComponent(player)}${gradeQs}`),
      api(`/v1/sales?player=${encodeURIComponent(player)}${gradeQs}&limit=15`),
    ]);

    if (!stats.matched) {
      $("out").textContent = `No priced sales found for “${player}”.`;
      return;
    }

    $("out").className = "";
    $("out").innerHTML = `
      <div class="stats">
        <div class="stat"><div class="k">Median</div><div class="v">${money(stats.median)}</div></div>
        <div class="stat"><div class="k">Average</div><div class="v">${money(stats.mean)}</div></div>
        <div class="stat"><div class="k">Low</div><div class="v">${money(stats.low)}</div></div>
        <div class="stat"><div class="k">High</div><div class="v">${money(stats.high)}</div></div>
        <div class="stat"><div class="k">Sales</div><div class="v">${stats.matched}</div></div>
      </div>
      <table>
        <thead><tr><th>Sold</th><th>Card</th><th>Grade</th><th style="text-align:right">Price</th></tr></thead>
        <tbody>${recent.sales.map((s) => `
          <tr>
            <td>${s.sold_date}</td>
            <td><a href="${s.url}" target="_blank" rel="noopener">${s.title.slice(0, 60)}</a></td>
            <td>${s.grader ? s.grader + " " + s.grade : "Raw"}</td>
            <td class="n">${money(s.price)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      <p style="font-size:13px;color:#898781">
        Prices exclude best-offer sales, where eBay publishes the seller's asking
        price rather than what the buyer paid.
      </p>`;
  } catch (err) {
    $("out").className = "msg";
    $("out").textContent = err.message;
  }
}

$("go").addEventListener("click", lookup);
$("player").addEventListener("keydown", (e) => { if (e.key === "Enter") lookup(); });
</script>
</body>
</html>
